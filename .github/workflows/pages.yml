# Pubblica la cartella «sito/» su GitHub Pages a ogni push, e ogni ora per le dediche del giardino.
# L'indirizzo è https://larosadoro.org/ (dal 21.10.2026; https://larosadoro.github.io/rosadoro/ porta lì).
# Il repository è larosadoro/rosadoro, nell'organizzazione della Fondazione dal 14.11.2026 (prima eliasminotti/rosadoro).
# Dal 26.10.2026 il sito è aperto ai motori di ricerca (ANTEPRIMA = False in costruisci.py).
#
# Prima di pubblicare, sorgenti/controlla.py controlla che le pagine corrispondano ai testi, che il JavaScript
# non abbia errori e che nessun collegamento interno sia rotto. Se un controllo non passa non si pubblica niente:
# online resta la versione di prima, e il workflow «Controlla il sito» apre una segnalazione per Elias.
#
# Le dediche del giardino dei ricordi stanno nel foglio «Contatti della Fondazione»: entrano nel sito
# quando si spunta la loro casella «Nel giardino». Ogni ora sorgenti/giardino.py chiede al foglio quelle
# spuntate e, se sono cambiate, il sito si ripubblica con il loro elenco (dediche.json accanto alla pagina).
# Le dediche non entrano mai nel repository. GitHub sospende i lavori di ogni ora se il repository
# resta fermo per sessanta giorni: si riaccendono dalla scheda Actions.
#
# Dopo ogni pubblicazione venuta da un invio (non nel giro di ogni ora), sorgenti/indexnow.py dice a Bing
# (e con lui a DuckDuckGo, Yahoo, Ecosia, Copilot), a Yandex, a Seznam e a Naver quali pagine della mappa sono
# nuove o cambiate (IndexNow, dal 23.11.2026). Se l’avviso non parte, la pubblicazione resta buona lo stesso:
# le pagine si troveranno dalla mappa, solo più tardi.
name: Pubblica il sito

on:
  push:
    branches:
      - claude/rosadoro-foundation-site-6hc5hu
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      pubblica: ${{ steps.giardino.outputs.pubblica }}
      avviso: ${{ steps.indexnow.outputs.avviso }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Controlla il sito prima di pubblicarlo
        run: python3 sorgenti/controlla.py
      - name: Configura Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Raccogli le dediche del giardino
        id: giardino
        run: python3 sorgenti/giardino.py "${{ steps.pages.outputs.base_url }}" "${{ github.sha }}" "${{ github.event_name }}"
      - name: Prepara l’avviso ai motori di ricerca (IndexNow)
        id: indexnow
        if: github.event_name == 'push' && steps.giardino.outputs.pubblica == 'true'
        continue-on-error: true
        env:
          PRIMA: ${{ github.event.before }}
          DOPO: ${{ github.sha }}
        run: python3 sorgenti/indexnow.py prepara "$PRIMA" "$DOPO"
      - name: Impacchetta la cartella sito/
        if: steps.giardino.outputs.pubblica == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito

  pubblica:
    needs: prepara
    if: needs.prepara.outputs.pubblica == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Scarica l’avviso ai motori
        if: needs.prepara.outputs.avviso != ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: sorgenti
      - name: Avvisa Bing e gli altri motori delle pagine cambiate (IndexNow)
        if: needs.prepara.outputs.avviso != ''
        continue-on-error: true
        env:
          AVVISO: ${{ needs.prepara.outputs.avviso }}
        run: python3 sorgenti/indexnow.py manda
